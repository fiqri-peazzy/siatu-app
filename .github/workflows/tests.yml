name: Tests

on:
  push:
    branches-ignore: [main] # main sudah diuji sebelum merge; deploy ada di deploy.yml
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, intl, gd, zip, bcmath, pdo_sqlite, exif, fileinfo
          tools: composer:v2
          coverage: none

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-dev-${{ hashFiles('composer.lock') }}

      - name: Composer install
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Prepare env
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run tests
        shell: bash
        run: |
          set +e
          php artisan test --compact 2>&1 | tee test-output.txt
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            # Ringkasan kegagalan sebagai annotation (bisa dibaca tanpa login ke log job)
            summary=$(grep -vE '^\s*$' test-output.txt | tail -80 | sed -e 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=Test gagal::${summary}"
          fi
          exit $status
