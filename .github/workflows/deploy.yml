name: Deploy ke cPanel

on:
  push:
    branches: [main]
  workflow_dispatch: # bisa dijalankan manual dari tab Actions

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ---------- Build PHP ----------
      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, intl, gd, zip, bcmath, pdo_mysql, exif, fileinfo
          tools: composer:v2
          coverage: none

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-${{ hashFiles('composer.lock') }}

      - name: Composer install (production)
        run: composer install --no-dev --prefer-dist --optimize-autoloader --no-interaction --no-progress

      # ---------- Build Frontend ----------
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Build assets (Vite)
        run: |
          npm ci
          npm run build

      # ---------- Paketkan release ----------
      # Server cPanel tidak punya rsync, jadi kirim sebagai tarball lewat SSH.
      # storage/ dan .env TIDAK ikut, supaya file upload & config di server aman.
      - name: Buat tarball release
        run: |
          tar -czf /tmp/release.tgz \
            --exclude='./.git' \
            --exclude='./.github' \
            --exclude='./node_modules' \
            --exclude='./tests' \
            --exclude='./.env' \
            --exclude='./storage' \
            --exclude='./public/storage' \
            --exclude='./public/hot' \
            --exclude='./bootstrap/cache/*.php' \
            .
          ls -lh /tmp/release.tgz

      # ---------- Deploy ----------
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -p "${{ secrets.SSH_PORT }}" -H "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts

      - name: Upload release
        run: |
          ssh -i ~/.ssh/id_deploy -p "${{ secrets.SSH_PORT }}" \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
            "cat > ~/siatu-release.tgz" < /tmp/release.tgz

      - name: Extract, migrate & cache
        run: |
          ssh -i ~/.ssh/id_deploy -p "${{ secrets.SSH_PORT }}" \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" bash -s <<'EOF'
          set -e
          APP="${{ secrets.DEPLOY_PATH }}"
          PHP="${{ secrets.PHP_BIN || 'php' }}"
          mkdir -p "$APP"
          cd "$APP"

          mkdir -p storage/app/public storage/app/private storage/logs \
                   storage/framework/cache/data storage/framework/sessions storage/framework/views \
                   bootstrap/cache

          # Maintenance mode (hanya jika app sudah pernah ter-deploy)
          if [ -f artisan ] && [ -d vendor ]; then $PHP artisan down --retry=15 || true; fi

          # Bersihkan folder hasil build agar tidak ada file usang, lalu extract
          rm -rf vendor public/build
          tar -xzf ~/siatu-release.tgz -C "$APP"
          rm -f ~/siatu-release.tgz

          if [ ! -f .env ]; then
            echo "::error::File .env belum ada di $APP — buat dulu di server."
            exit 1
          fi

          $PHP artisan migrate --force
          [ -e public/storage ] || $PHP artisan storage:link || true
          $PHP artisan optimize:clear
          $PHP artisan optimize
          $PHP artisan queue:restart || true
          $PHP artisan up
          echo "Deploy selesai: $(date)"
          EOF
